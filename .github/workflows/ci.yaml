name : Japan House Prediction CI pipeline

on: push 

jobs: 
  project-testing:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v5

    - name: setup python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.12'

    - name: Cache pip dependencies 
      uses: actions/cache@v4
      with: 
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: install dependencies
      run: |
       pip install -r requirements.txt

    - name: run pipeline
      env: 
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: |
        dvc repro 

    - name: promote model to production 
      if: success()
      env:
        DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      run: python script/promoted_model.py

    # Login to Docker Hub 
    - name: Login to Docker Hub
      if: success()
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    # Build Frontend Docker Image
  
    - name: Build Frontend Docker Image
      if: success()
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/japan-house-prediction-frontend:latest -f frontend/Dockerfile .
     
     # Push Frontend Docker Image
    - name: Push Frontend Docker Image
      if: success()
      run: |
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/japan-house-prediction-frontend:latest
    
    # Build Backend Docker Image 
    - name: Build Backend Docker Image
      if: success()
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/japan-house-prediction-backend:latest -f fast_api/Dockerfile fast_api
    
    # Push Backend Docker Image
    - name: Push Backend Docker Image
      if: success()
      run: |
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/japan-house-prediction-backend:latest



















